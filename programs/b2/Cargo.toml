# BORDR Pair: a Bordrless Workshop pair (hook/ and script/) and its LiteSVM tests (tests/).
#
# hook/ is the hook template, its own workspace (as the builder's Cargo.toml has it): build it with
#   cd hook && cargo build-sbf --tools-version v1.57 --arch v3
# script/ is the companion template, a member here: build it with
#   cargo build-sbf --tools-version v1.57 --arch v3 --manifest-path script/Cargo.toml
# The tests load both builds and the Bordrless programs dumped from mainnet into fixtures/
# (scripts/build.sh does all of it).
[workspace]
members = ["script", "tests"]
exclude = ["hook"]
resolver = "2"

# Anchor's recommended release profile for on-chain programs. overflow-checks is load-bearing.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
