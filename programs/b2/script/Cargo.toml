# Bordrless's companion template (the builder's Cargo.toml, from the companion brief), for a build
# on your machine. Local copy: the two crates are pinned to faa446e56b544b411721648f3b79b70ba4a00355 (the programs repo's head on
# 2026-10-17) so the tests in ../tests resolve the same crates; the builder's own names no rev.
[package]
name = "workshop-script"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "workshop_script"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = "=1.2.0"
bordrless-launch = { git = "https://github.com/BordrlessDex/bordrless-programs", rev = "faa446e56b544b411721648f3b79b70ba4a00355",
                     features = ["no-entrypoint"] }
bordrless-token = { git = "https://github.com/BordrlessDex/bordrless-programs", rev = "faa446e56b544b411721648f3b79b70ba4a00355",
                    features = ["no-entrypoint"] }
